<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PWD 2027" />
  <link rel="manifest" href="./manifest.json" />
  <title>2027 奈良県 友団合同 パインウッドダービー 速報ボード</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #0b1220;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #e11d48;
      --primary-dark: #9f1239;
      --accent: #f59e0b;
      --ok: #10b981;
      --border: #e2e8f0;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
      background: #f1f5f9;
      color: var(--text);
      padding-bottom: 84px;
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #881337 100%);
      color: #fff;
      padding: 14px 16px 18px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.22);
    }
    .checker {
      height: 8px;
      background-image: linear-gradient(45deg, #fff 25%, transparent 25%),
        linear-gradient(-45deg, #fff 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #fff 75%),
        linear-gradient(-45deg, transparent 75%, #fff 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
      opacity: 0.9;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .badge-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #a7f3d0;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
    }
    .sync-pill.offline {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(251, 191, 36, 0.5);
      color: #fde68a;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }
    .sync-pill.offline .dot {
      background: #fbbf24;
      box-shadow: none;
    }
    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .rule-btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      font-size: 11px;
      font-weight: 900;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35);
    }
    .hp-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .title {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .sub {
      margin: 4px 0 0;
      font-size: 11px;
      color: #cbd5e1;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      border: 1px solid var(--border);
    }
    .card-title {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .card-desc {
      margin: 0 0 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .rule-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .rule-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
    }
    .rule-box strong {
      display: block;
      color: #0f172a;
      margin-bottom: 3px;
    }
    .rank-item {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: #fff;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .rank-item:active { transform: scale(0.99); }
    .rank-item.top1 {
      border-color: #f59e0b;
      background: linear-gradient(135deg, #fffbeb 0%, #ffffff 70%);
    }
    .rank-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .rank-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .pos-badge {
      min-width: 48px;
      text-align: center;
      font-weight: 900;
      font-size: 13px;
      padding: 5px 8px;
      border-radius: 999px;
      background: #0f172a;
      color: #fff;
    }
    .top1 .pos-badge {
      background: #f59e0b;
      color: #0f172a;
    }
    .team-name {
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .team-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .avg-score {
      text-align: right;
      flex-shrink: 0;
    }
    .avg-num {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary);
    }
    .avg-unit {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .bar-wrap {
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #e11d48);
      border-radius: 999px;
    }
    .breakdown {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
      font-size: 12px;
      color: #334155;
      display: none;
    }
    .rank-item.open .breakdown { display: block; }
    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .chip {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin: 10px 0 4px;
      color: #1e293b;
    }
    select, input[type="text"], input[type="number"], input[type="password"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      color: #0f172a;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-dark {
      background: #0f172a;
      color: #fff;
    }
    .btn-outline {
      background: #fff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }
    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
      padding: 6px 10px;
      width: auto;
      font-size: 12px;
      margin-top: 0;
    }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 30;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      background: none;
      border: none;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .nav-btn.active {
      color: var(--primary);
    }
    .nav-icon {
      font-size: 17px;
      line-height: 1;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 18px;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    .rule-sec {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.6;
    }
    .rule-sec h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 6px;
      background: #fff;
    }
    .rule-table th, .rule-table td {
      border: 1px solid #cbd5e1;
      padding: 6px 8px;
      text-align: center;
    }
    .rule-table th {
      background: #0f172a;
      color: #fff;
    }
    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 60;
      display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="badge-row">
        <button id="syncBadge" class="sync-pill offline" onclick="openFirebaseModal()">
          <span class="dot"></span>
          <span id="syncText">ローカル動作中（Firebase設定）</span>
        </button>
      </div>
      <div class="header-actions">
        <button class="rule-btn" onclick="openRulesModal()">📖 大会ルール</button>
        <a class="hp-btn" href="https://tarsier-rrzzn0.my.canva.site/shiki-1-pc-2027pwd" target="_blank" rel="noopener">特設HP ↗</a>
      </div>
    </div>
    <h1 class="title">2027 奈良県 友団合同 パインウッドダービー</h1>
    <p class="sub">2027年3月7日(日) 三宅町体育館 ｜ リアルタイム速報＆運営ボード</p>
  </header>
  <div class="checker"></div>

  <div id="toast" class="toast"></div>
  <main class="container" id="app"></main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="team" onclick="switchTab('team')">
      <span class="nav-icon">🏆</span><span>チーム戦</span>
    </button>
    <button class="nav-btn" data-tab="individual" onclick="switchTab('individual')">
      <span class="nav-icon">🏎️</span><span>個人戦</span>
    </button>
    <button class="nav-btn" data-tab="design" onclick="switchTab('design')">
      <span class="nav-icon">🎨</span><span>デザイン賞</span>
    </button>
    <button class="nav-btn" data-tab="history" onclick="switchTab('history')">
      <span class="nav-icon">📋</span><span>レース履歴</span>
    </button>
    <button class="nav-btn" data-tab="admin" onclick="switchTab('admin')">
      <span class="nav-icon">⚙️</span><span>運営入力</span>
    </button>
  </nav>

  <!-- 大会ルール閲覧モーダル -->
  <div id="rulesModal" class="modal-backdrop" onclick="if(event.target===this)closeRulesModal()">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 style="margin:0;font-size:17px;font-weight:900;">📖 大会競技規則・進行ルール</h3>
        <button onclick="closeRulesModal()" style="border:none;background:#f1f5f9;border-radius:999px;width:30px;height:30px;font-weight:900;cursor:pointer;">✕</button>
      </div>
      <div class="chip-row" id="ruleTabs">
        <button class="chip active" onclick="switchRuleTab('spec', this)">車検・規格</button>
        <button class="chip" onclick="switchRuleTab('flow', this)">当日の流れ</button>
        <button class="chip" onclick="switchRuleTab('race', this)">対戦方式</button>
        <button class="chip" onclick="switchRuleTab('design', this)">デザイン賞</button>
        <button class="chip" onclick="switchRuleTab('team', this)">チーム戦得点</button>
      </div>
      <div id="ruleBody"></div>
      <button class="btn btn-dark" onclick="closeRulesModal()">閉じる</button>
    </div>
  </div>

  <!-- Firebase設定モーダル -->
  <div id="fbModal" class="modal-backdrop" onclick="if(event.target===this)closeFirebaseModal()">
    <div class="modal-card">
      <h3 style="margin:0 0 6px;font-size:16px;">Firebase リアルタイム共有設定</h3>
      <p style="margin:0 0 12px;font-size:12px;color:#64748b;">
        複数端末でリアルタイム同期する場合は Firebase Realtime Database（REST URL）を入力してください。未設定でもこの端末内で即座に動作します。
      </p>
      <label>Firebase Realtime Database URL（例: https://your-project-default-rtdb.firebaseio.com）</label>
      <input type="text" id="fbDbUrl" placeholder="https://....firebaseio.com" />
      <label>大会ルームID</label>
      <input type="text" id="fbRoomId" placeholder="pwd-2027-nara" />
      <button class="btn btn-primary" onclick="saveFirebaseConfig()">保存して同期を開始</button>
      <button class="btn btn-outline" onclick="closeFirebaseModal()">閉じる</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "pwd_2027_shiki1_state_v1";
    const FB_CFG_KEY = "pwd_2027_shiki1_fb_cfg_v1";
    const PASSCODE = "2027";

    const RULE_SECTIONS = {
      spec: `
        <div class="rule-sec">
          <h4>📏 車検サイズと重さの上限</h4>
          <table class="rule-table">
            <tr><th>全長（タテ）</th><th>全幅（ヨコ）</th><th>高さ</th><th>重さ上限</th></tr>
            <tr><td><b>178 mm以下</b></td><td><b>70 mm以下</b></td><td>規定なし</td><td><b>142 g以下</b></td></tr>
          </table>
          <ul style="margin:8px 0 0;padding-left:18px;font-size:12px;">
            <li><b>潤滑油・シリコン等の塗布は禁止</b>です。</li>
            <li><b>黒鉛（グラファイトパウダー）の塗布は可</b>です。</li>
            <li>到着順に車検・出走枠抽選を行い、合格後に展示スペースへ配置します。</li>
          </ul>
        </div>
        <div class="rule-sec">
          <h4>🚦 出走の4ステップ</h4>
          <ol style="margin:0;padding-left:18px;font-size:12px;">
            <li>計量置き台で待機し、自分のマシンの出走順を待ちます。</li>
            <li>観客席前で4人横並びになり、30秒でマシンのこだわりや見どころをアピールします。</li>
            <li>各自レーンに置いて一歩下がり、スタートの合図に合わせて発走します。</li>
            <li>コース脇からスマートフォンで走行動画を撮影して判定し、コール後に順位シールを受け取ります。</li>
          </ol>
        </div>
      `,
      flow: `
        <div class="rule-sec">
          <h4>🕒 大会当日のタイムスケジュール</h4>
          <ul style="margin:0;padding-left:18px;font-size:12px;">
            <li><b>09:00</b> 指導者設営（車検コーナー・展示テーブル）</li>
            <li><b>09:30</b> スカウト車検・出走枠抽選</li>
            <li><b>10:00</b> 開会式</li>
            <li><b>10:15</b> 第1レース（約20戦・4台一斉走行＋動画判定）</li>
            <li><b>11:05</b> 休憩・枠組み作成</li>
            <li><b>11:15</b> 第2レース（約25戦：チャレンジ戦・チャンピオン戦・決勝）</li>
            <li><b>12:00</b> 昼休憩・デザイン投票・推し指導者決定（<b>12:50締切</b>）</li>
            <li><b>12:50</b> 指導者戦 → <b>13:05</b> 最速王戦</li>
            <li><b>13:35</b> 表彰式 → <b>14:30頃</b> 解散</li>
          </ul>
        </div>
      `,
      race: `
        <div class="rule-sec">
          <h4>🏁 チャンピオン戦とチャレンジ戦の流れ</h4>
          <ul style="margin:0;padding-left:18px;font-size:12px;">
            <li><b>第1レース：</b>抽選で組分け・レーンを決定（4台一斉走行）。<b>1位・2位はチャンピオン戦</b>、<b>3位・4位はチャレンジ戦</b>へ進出。</li>
            <li><b>チャンピオン戦：</b>1回戦（各組4台一斉走行）の<b>1位のみ</b>が決勝戦へ進出。各部門優勝者4名で「総合チャンピオン決定戦（一発勝負）」を実施。</li>
            <li><b>チャレンジ戦：</b>1回戦（各組4台一斉走行）の<b>1位のみ</b>が決勝戦へ進出し、チャレンジリーグ優勝者を決定。</li>
            <li><b>指導者部門：</b>各団・隊ごとに2台＋ゲスト（計16台）で予選4戦→決勝戦を実施。</li>
          </ul>
        </div>
        <div class="rule-sec">
          <h4>🥷 刺客マシン（端数調整）ルール</h4>
          <p style="margin:0;font-size:12px;">
            2〜3台の端数が出たときは、出走スカウトが指導者戦に出ない指導者車のクジを引き、選ばれた指導者マシンが参戦します。刺客車も1〜4位として着順カウントし、スカウトには実際の着順通りのシール・勝ち上がりを適用します。
          </p>
        </div>
      `,
      design: `
        <div class="rule-sec">
          <h4>🎨 COOL賞・CUTE賞 規定</h4>
          <ul style="margin:0;padding-left:18px;font-size:12px;">
            <li><b>部門別表彰：</b>ビーバー・うさぎ・しか・くまのグループごとに「COOL賞」「CUTE賞」を選出・表彰します。</li>
            <li><b>投票方法：</b>昼休み中に展示車を見て、A5投票用紙に車名ではなく<b>エントリー番号</b>を記入して投票箱へ入れます（自分の組の車にも投票可・12:50締切）。</li>
            <li><b>重複時の扱い：</b>同一車が両賞で1位になった場合は得票の多い賞を受賞し、もう一方は2位を繰り上げます（W受賞なし・同票はジャンケン）。</li>
          </ul>
        </div>
      `,
      team: `
        <div class="rule-sec">
          <h4>🏆 チーム対抗戦 得点・平均点ルール</h4>
          <table class="rule-table">

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {
        teams: DEFAULT_TEAMS,
        cars: DEFAULT_CARS,
        races: [],
        designAwards: {
          ビーバー: { cool: "", cute: "" },
          うさぎ: { cool: "", cute: "" },
          しか: { cool: "", cute: "" },
          くま: { cool: "", cute: "" }
        },
        leaderPicks: {},
        updatedAt: Date.now()
      };
    }

    function saveState(pushCloud = true) {
      state.updatedAt = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (pushCloud) pushToFirebase();
    }

    function getFbConfig() {
      try {
        return JSON.parse(localStorage.getItem(FB_CFG_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function updateSyncBadge(connected) {
      const el = document.getElementById("syncBadge");
      const txt = document.getElementById("syncText");
      if (!el || !txt) return;
      if (connected) {
        el.classList.remove("offline");
        txt.textContent = "リアルタイム同期中";
      } else {
        el.classList.add("offline");
        txt.textContent = "ローカル動作中（Firebase設定）";
      }
    }

    async function pushToFirebase() {
      const cfg = getFbConfig();
      if (!cfg.dbUrl) return;
      const room = encodeURIComponent(cfg.roomId || "pwd-2027-nara");
      const base = cfg.dbUrl.replace(/\/+$/, "");
      try {
        const res = await fetch(`${base}/rooms/${room}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(state)
        });
        updateSyncBadge(res.ok);
      } catch (e) {
        updateSyncBadge(false);
      }
    }

    async function pullFromFirebase() {
      const cfg = getFbConfig();
      if (!cfg.dbUrl) {
        updateSyncBadge(false);
        return;
      }
      const room = encodeURIComponent(cfg.roomId || "pwd-2027-nara");
      const base = cfg.dbUrl.replace(/\/+$/, "");
      try {
        const res = await fetch(`${base}/rooms/${room}.json`);
        if (!res.ok) {
          updateSyncBadge(false);
          return;
        }
        const remote = await res.json();
        updateSyncBadge(true);
        if (remote && remote.updatedAt && remote.updatedAt > (state.updatedAt || 0)) {
          state = remote;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
        }
      } catch (e) {
        updateSyncBadge(false);
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pullFromFirebase();
      pollTimer = setInterval(pullFromFirebase, 4000);
    }

    function openRulesModal() {
      document.getElementById("rulesModal").classList.add("open");
      const firstChip = document.querySelector("#ruleTabs .chip");
      switchRuleTab("spec", firstChip);
    }

    function closeRulesModal() {
      document.getElementById("rulesModal").classList.remove("open");
    }

    function switchRuleTab(key, el) {
      document.querySelectorAll("#ruleTabs .chip").forEach(c => c.classList.remove("active"));
      if (el) el.classList.add("active");
      document.getElementById("ruleBody").innerHTML = RULE_SECTIONS[key] || "";
    }

    function openFirebaseModal() {
      const cfg = getFbConfig();
      document.getElementById("fbDbUrl").value = cfg.dbUrl || "";
      document.getElementById("fbRoomId").value = cfg.roomId || "pwd-2027-nara";
      document.getElementById("fbModal").classList.add("open");
    }

    function closeFirebaseModal() {
      document.getElementById("fbModal").classList.remove("open");
    }

    function saveFirebaseConfig() {
      const dbUrl = document.getElementById("fbDbUrl").value.trim();
      const roomId = document.getElementById("fbRoomId").value.trim() || "pwd-2027-nara";
      localStorage.setItem(FB_CFG_KEY, JSON.stringify({ dbUrl, roomId }));
      closeFirebaseModal();
      showToast(dbUrl ? "Firebase設定を保存しました" : "ローカルモードに戻しました");
      startPolling();
      if (dbUrl) pushToFirebase();
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function getPointsByCategory(category, rankIndex) {
      const isChamp = category === "チャンピオン戦" || category === "最速王決定戦";
      const table = isChamp ? [6, 5, 4, 3] : [4, 3, 2, 1];
      return table[rankIndex] || 0;
    }

    function computeStats() {
      const carStats = {};
      state.cars.forEach(c => {
        carStats[c.no] = { ...c, wins: 0, races: 0, points: 0 };
      });

      const teamStats = {};
      state.teams.forEach(t => {
        teamStats[t.id] = {
          ...t,
          racePts: 0,
          designPts: 0,
          leaderPts: 0,
          totalPts: 0,
          avgPts: 0
        };
      });

      state.races.forEach(r => {
        const order = r.order || [];
        order.forEach((carNo, idx) => {
          if (!carNo || carNo === "__GUEST__") return;
          const pts = getPointsByCategory(r.category, idx);
          if (carStats[carNo]) {
            carStats[carNo].races += 1;
            carStats[carNo].points += pts;
            if (idx === 0) carStats[carNo].wins += 1;
            const tid = carStats[carNo].teamId;
            if (teamStats[tid]) {
              teamStats[tid].racePts += pts;
            }
          }
        });
      });

      Object.values(state.designAwards || {}).forEach(award => {
        ["cool", "cute"].forEach(type => {
          const no = award && award[type];
          if (no && carStats[no]) {
            const tid = carStats[no].teamId;
            if (teamStats[tid]) teamStats[tid].designPts += 5;
          }
        });
      });

      Object.entries(state.leaderPicks || {}).forEach(([teamId, pick]) => {
        if (!teamStats[teamId] || !pick || !pick.leader) return;
        let bonus = 0;
        if (pick.stage === "final") bonus += 5;
        if (pick.rank === "1") bonus += 5;
        else if (pick.rank === "2") bonus += 3;
        else if (pick.rank === "3") bonus += 2;
        else if (pick.rank === "4") bonus += 1;
        teamStats[teamId].leaderPts += bonus;
      });

      const rankedTeams = Object.values(teamStats).map(t => {
        const totalPts = t.racePts + t.designPts + t.leaderPts;
        const members = Math.max(1, Number(t.members) || 1);
        return { ...t, totalPts, avgPts: Number((totalPts / members).toFixed(2)) };
      }).sort((a, b) => b.avgPts - a.avgPts || b.totalPts - a.totalPts);

      const rankedCars = Object.values(carStats).sort((a, b) => b.wins - a.wins || b.points - a.points);

      return { rankedTeams, rankedCars };
    }

              <option value="4">4位（+1pt）</option>
            </select>
            <button class="btn btn-dark" onclick="saveLeaderPick()">推し指導者ボーナスを保存</button>
          </div>

          <div class="card">
            <h3 class="card-title">👥 チーム出走人数・CSV名簿一括登録</h3>
            ${state.teams.map(t => `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;">
                <span style="font-size:13px;font-weight:700;">${t.name}</span>
                <input type="number" min="1" max="50" style="width:84px;" value="${t.members}" onchange="updateTeamMembers('${t.id}', this.value)" />
              </div>
            `).join("")}
            <label>エントリーCSV一括登録（車番,車名,スカウト名,部門,チームID）</label>
            <textarea id="csvInput" rows="4" placeholder="B-3,ライトニング,奈良 太郎,ビーバー,T1&#10;U-3,スカイホーク,桜井 花子,うさぎ,T2"></textarea>
            <button class="btn btn-outline" onclick="importCsv()">CSV名簿を反映</button>
            <button class="btn btn-outline" onclick="resetDemoData()" style="color:#b91c1c;">全データを初期化</button>
          </div>
        `;
      }
    }

    function unlockAdmin() {
      const val = document.getElementById("passInput").value.trim();
      if (val === PASSCODE) {
        adminUnlocked = true;
        render();
        showToast("運営入力を解除しました");
      } else {
        showToast("パスコードが異なります");
      }
    }

    function submitRace() {
      const category = document.getElementById("raceCategory").value;
      const label = document.getElementById("raceLabel").value.trim();
      const order = [
        document.getElementById("r1").value,
        document.getElementById("r2").value,
        document.getElementById("r3").value,
        document.getElementById("r4").value
      ].filter(Boolean);
      if (order.length === 0) {
        showToast("少なくとも1位のマシンを選択してください");
        return;
      }
      state.races.push({
        id: "race_" + Date.now(),
        category,
        label,
        order,
        createdAt: new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })
      });
      saveState(true);
      render();
      showToast("レース結果を登録しました");
    }

    function deleteRace(id) {
      state.races = state.races.filter(r => r.id !== id);
      saveState(true);
      render();
      showToast("レース結果を取り消しました");
    }

    function saveDesignAwards() {
      ["ビーバー", "うさぎ", "しか", "くま"].forEach(g => {
        state.designAwards[g] = {
          cool: document.getElementById(`cool_${g}`).value,
          cute: document.getElementById(`cute_${g}`).value
        };
      });
      saveState(true);
      showToast("デザイン賞を保存しました");
    }

    function saveLeaderPick() {
      const tid = document.getElementById("pickTeam").value;
      state.leaderPicks[tid] = {
        leader: document.getElementById("pickLeader").value,
        stage: document.getElementById("pickStage").value,
        rank: document.getElementById("pickRank").value
      };
      saveState(true);
      showToast("推し指導者ボーナスを保存しました");
    }

    function updateTeamMembers(tid, val) {
      const n = Math.max(1, parseInt(val, 10) || 1);
      const t = state.teams.find(x => x.id === tid);
      if (t) {
        t.members = n;
        saveState(true);
        showToast(`${t.name} の出走人数を ${n}名 に更新しました`);
      }
    }

    function importCsv() {
      const raw = document.getElementById("csvInput").value.trim();
      if (!raw) return;
      const lines = raw.split(/\r?\n/);
      let added = 0;
      lines.forEach(line => {
        const cols = line.split(",").map(s => s.trim());
        if (cols.length >= 2 && cols[0] && cols[1]) {
          const item = {
            no: cols[0],
            name: cols[1],
            scout: cols[2] || "出走者",
            group: cols[3] || "ビーバー",
            teamId: cols[4] || "T1"
          };
          const idx = state.cars.findIndex(c => c.no === item.no);
          if (idx >= 0) state.cars[idx] = item;
          else state.cars.push(item);
          added++;
        }
      });
      saveState(true);
      render();
      showToast(`${added}台分の名簿を反映しました`);
    }

    function resetDemoData() {
      if (!confirm("レース履歴・賞・名簿を初期状態に戻しますか？")) return;
      state = {
        teams: DEFAULT_TEAMS,
        cars: DEFAULT_CARS,
        races: [],
        designAwards: {
          ビーバー: { cool: "", cute: "" },
          うさぎ: { cool: "", cute: "" },
          しか: { cool: "", cute: "" },
          くま: { cool: "", cute: "" }
        },
        leaderPicks: {},
        updatedAt: Date.now()
      };
      saveState(true);
      render();
      showToast("初期状態に戻しました");
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    render();
    startPolling();
  </script>
</body>
</html>
